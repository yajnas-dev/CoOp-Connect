<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Details - Co-Op Connect</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-body">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">🤝</div>

            <div>
                <h2>Co-Op Connect</h2>
                <span>Customer Portal</span>
            </div>

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-item">
                <span>🏠</span>
                Dashboard
            </a>

            <a href="services.html" class="nav-item">
                <span>🔧</span>
                Find Services
            </a>

            <a href="workers.html" class="nav-item">
                <span>👷</span>
                Find Workers
            </a>

            <a href="bookings.html" class="nav-item active">
                <span>📋</span>
                My Bookings
            </a>

            <a href="#" class="nav-item">
                <span>💳</span>
                Payments
            </a>

            <a href="#" class="nav-item">
                <span>⭐</span>
                My Reviews
            </a>

            <a href="#" class="nav-item">
                <span>⚠️</span>
                Complaints
            </a>

            <a href="#" class="nav-item">
                <span>👤</span>
                My Profile
            </a>

        </nav>


        <button class="nav-item logout-btn" onclick="logout()">
            <span>🚪</span>
            Logout
        </button>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="dashboard-main">

        <!-- Header -->

        <header class="dashboard-header">

            <div>

                <h1>Booking Details</h1>

                <p>
                    View your complete service request.
                </p>

            </div>


            <div class="header-profile">

                <div class="notification-icon">
                    🔔
                    <span class="notification-badge">2</span>
                </div>

                <div class="profile-mini">

                    <div class="profile-avatar">
                        V
                    </div>

                    <div>
                        <strong>Varsha</strong>
                        <small>Customer</small>
                    </div>

                </div>

            </div>

        </header>


        <!-- Back -->

        <a href="bookings.html" class="back-link">
            ← Back to My Bookings
        </a>


        <div id="bookingContent">

            <!-- Content generated by JavaScript -->

        </div>


    </main>


<script>

    /* ========================================
       GET SELECTED BOOKING
    ======================================== */

    const bookingId =
        localStorage.getItem(
            "selectedBookingId"
        );


    const bookings =
        JSON.parse(
            localStorage.getItem("coopBookings")
        ) || [];


    const booking =
        bookings.find(
            item => item.id === bookingId
        );


    const container =
        document.getElementById(
            "bookingContent"
        );


    /* ========================================
       IF BOOKING NOT FOUND
    ======================================== */

    if (!booking) {

        container.innerHTML = `

            <div class="empty-bookings">

                <div class="empty-icon">
                    📋
                </div>

                <h3>
                    Booking Not Found
                </h3>

                <p>
                    The selected booking could not be found.
                </p>

                <a
                    href="bookings.html"
                    class="primary-btn"
                >
                    Back to Bookings
                </a>

            </div>

        `;

    }

    else {

        displayBooking();

    }


    /* ========================================
       DISPLAY BOOKING
    ======================================== */

    function displayBooking() {

        container.innerHTML = `

            <!-- ================= TOP CARD ================= -->

            <div class="booking-detail-top">

                <div>

                    <span class="booking-id">
                        ${booking.id}
                    </span>

                    <h2>
                        ${booking.service} Service
                    </h2>

                    <p>
                        Requested on
                        ${formatCreatedDate(booking.createdAt)}
                    </p>

                </div>


                <span class="status-badge ${getStatusClass(booking.status)}">

                    ${formatStatus(booking.status)}

                </span>

            </div>


            <!-- ================= STATUS TIMELINE ================= -->

            <div class="dashboard-card">

                <div class="section-header">

                    <div>

                        <h2>Booking Status</h2>

                        <p>
                            Track the progress of your service.
                        </p>

                    </div>

                </div>


                <div class="booking-timeline">

                    ${createTimeline()}

                </div>

            </div>


            <!-- ================= TWO COLUMNS ================= -->

            <div class="booking-details-grid">


                <!-- SERVICE DETAILS -->

                <div class="dashboard-card">

                    <h2>Service Information</h2>


                    <div class="detail-info-list">

                        <div class="detail-info-row">

                            <span>Service</span>

                            <strong>
                                ${booking.service}
                            </strong>

                        </div>


                        <div class="detail-info-row">

                            <span>Worker</span>

                            <strong>
                                ${booking.worker}
                            </strong>

                        </div>


                        <div class="detail-info-row">

                            <span>Date</span>

                            <strong>
                                ${formatDate(booking.date)}
                            </strong>

                        </div>


                        <div class="detail-info-row">

                            <span>Time</span>

                            <strong>
                                ${booking.time}
                            </strong>

                        </div>


                        <div class="detail-info-row">

                            <span>Complexity</span>

                            <strong>
                                ${booking.complexity}
                            </strong>

                        </div>


                        <div class="detail-info-row">

                            <span>Address</span>

                            <strong>
                                ${booking.address}
                            </strong>

                        </div>

                    </div>


                    <div class="description-box">

                        <strong>
                            Service Description
                        </strong>

                        <p>
                            ${booking.description}
                        </p>

                    </div>

                </div>


                <!-- FAIR WAGE -->

                <div class="fair-wage-card">

                    <div class="fair-wage-icon">
                        💰
                    </div>

                    <h2>
                        Fair Wage
                    </h2>

                    <p class="wage-note">
                        Transparent cooperative pricing.
                    </p>


                    <div class="wage-breakdown">

                        <div class="wage-row">

                            <span>
                                Base Wage
                            </span>

                            <strong>
                                ₹${booking.baseWage}
                            </strong>

                        </div>


                        <div class="wage-row">

                            <span>
                                Skill Premium
                            </span>

                            <strong>
                                ₹${booking.skillPremium}
                            </strong>

                        </div>


                        <div class="wage-row">

                            <span>
                                Travel / Distance
                            </span>

                            <strong>
                                ₹${booking.travelCharge}
                            </strong>

                        </div>


                        <div class="wage-row">

                            <span>
                                Complexity
                            </span>

                            <strong>
                                ₹${booking.complexityCharge}
                            </strong>

                        </div>

                    </div>


                    <div class="total-wage">

                        <span>
                            Total Fair Wage
                        </span>

                        <strong>
                            ₹${booking.fairWage}
                        </strong>

                    </div>


                    <p class="transparent-note">

                        ✓ No hidden charges

                    </p>

                </div>

            </div>


            <!-- ================= PAYMENT ================= -->

            <div class="dashboard-card payment-section">

                <div>

                    <h2>
                        Payment
                    </h2>

                    <p>
                        Payment will be recorded after
                        the service is completed.
                    </p>

                </div>


                <div class="payment-box">

                    <div>

                        <small>
                            Payment Status
                        </small>

                        <strong>
                            ${booking.paymentStatus}
                        </strong>

                    </div>


                    ${
                        booking.status === "COMPLETED"
                        ?
                        `
                        <button
                            class="primary-btn"
                            onclick="makePayment()"
                        >
                            Pay ₹${booking.fairWage}
                        </button>
                        `
                        :
                        `
                        <span class="payment-wait">
                            Payment available after completion
                        </span>
                        `
                    }

                </div>

            </div>


            <!-- ================= ACTIONS ================= -->

            <div class="booking-detail-actions">

                ${
                    booking.status === "PENDING"
                    ?
                    `
                    <button
                        class="danger-btn"
                        onclick="cancelBooking()"
                    >
                        Cancel Booking
                    </button>
                    `
                    :
                    ""
                }


                ${
                    booking.status === "COMPLETED"
                    ?
                    `
                    <button
                        class="primary-btn"
                        onclick="writeReview()"
                    >
                        ⭐ Rate Worker
                    </button>
                    `
                    :
                    ""
                }

            </div>

        `;

    }


    /* ========================================
       TIMELINE
    ======================================== */

    function createTimeline() {

        const steps = [

            {
                status: "PENDING",
                icon: "📝",
                title: "Booking Requested",
                text: "Your request has been sent to the worker."
            },

            {
                status: "ACCEPTED",
                icon: "✓",
                title: "Worker Accepted",
                text: "The worker accepted your service request."
            },

            {
                status: "IN_PROGRESS",
                icon: "🔧",
                title: "Service In Progress",
                text: "The worker is currently working on the service."
            },

            {
                status: "COMPLETED",
                icon: "🎉",
                title: "Service Completed",
                text: "The service has been completed successfully."
            }

        ];


        const order = [
            "PENDING",
            "ACCEPTED",
            "IN_PROGRESS",
            "COMPLETED"
        ];


        const currentIndex =
            order.indexOf(booking.status);


        return steps.map(
            (step, index) => {

                const completed =
                    index <= currentIndex;


                return `

                    <div class="
                        timeline-item
                        ${completed ? "timeline-completed" : ""}
                    ">

                        <div class="timeline-icon">

                            ${step.icon}

                        </div>

                        <div class="timeline-content">

                            <strong>
                                ${step.title}
                            </strong>

                            <p>
                                ${step.text}
                            </p>

                        </div>

                    </div>

                `;

            }
        ).join("");

    }


    /* ========================================
       STATUS CLASS
    ======================================== */

    function getStatusClass(status) {

        return status
            .toLowerCase()
            .replace("_", "-");

    }


    /* ========================================
       FORMAT STATUS
    ======================================== */

    function formatStatus(status) {

        return status
            .replace("_", " ")
            .replace(/\b\w/g, letter =>
                letter.toUpperCase()
            );

    }


    /* ========================================
       FORMAT DATE
    ======================================== */

    function formatDate(date) {

        if (!date) {
            return "Not selected";
        }


        return new Date(
            date + "T00:00:00"
        ).toLocaleDateString(
            "en-IN",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );

    }


    /* ========================================
       CREATED DATE
    ======================================== */

    function formatCreatedDate(date) {

        if (!date) {
            return "Unknown";
        }


        return new Date(date)
            .toLocaleDateString(
                "en-IN",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

    }


    /* ========================================
       CANCEL BOOKING
    ======================================== */

    function cancelBooking() {

        const confirmed =
            confirm(
                "Are you sure you want to cancel this booking?"
            );


        if (!confirmed) {
            return;
        }


        const updatedBookings =
            bookings.map(item => {

                if (item.id === booking.id) {

                    return {
                        ...item,
                        status: "CANCELLED"
                    };

                }

                return item;

            });


        localStorage.setItem(
            "coopBookings",
            JSON.stringify(updatedBookings)
        );


        window.location.href =
            "bookings.html";

    }


    /* ========================================
       PAYMENT
    ======================================== */

    function makePayment() {

        const updatedBookings =
            bookings.map(item => {

                if (item.id === booking.id) {

                    return {
                        ...item,
                        paymentStatus: "PAID"
                    };

                }

                return item;

            });


        localStorage.setItem(
            "coopBookings",
            JSON.stringify(updatedBookings)
        );


        alert(
            "Payment recorded successfully! ✓"
        );


        location.reload();

    }


    /* ========================================
       REVIEW
    ======================================== */

    function writeReview() {

        alert(
            "Review module will be connected next."
        );

    }


    /* ========================================
       LOGOUT
    ======================================== */

    function logout() {

        localStorage.removeItem("token");

        localStorage.removeItem("user");

        window.location.href =
            "../login.html";

    }

</script>

</body>
</html>
