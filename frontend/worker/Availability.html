<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CoopGig - Availability</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>


<!-- =====================================================
                         NAVBAR
====================================================== -->

<header class="navbar">

    <div class="logo">
        CoopGig
    </div>

    <div class="worker-name">
        👷 Worker
    </div>

</header>



<!-- =====================================================
                         SIDEBAR
====================================================== -->

<aside class="sidebar">


    <div class="worker-card">

        <div class="worker-icon">
            👷
        </div>

        <h3>
            Worker
        </h3>

        <p id="sideAvailability">
            Available for Work
        </p>

    </div>



    <!-- DASHBOARD -->

    <a href="dashboard.html"
       class="menu">

        🏠 <span>Dashboard</span>

    </a>



    <!-- REGISTRATION -->

    <a href="registration.html"
       class="menu">

        📝 <span>Registration</span>

    </a>



    <!-- PROFILE -->

    <a href="profile.html"
       class="menu">

        👤 <span>My Profile</span>

    </a>



    <!-- DOCUMENTS -->

    <a href="documents.html"
       class="menu">

        📄 <span>Documents</span>

    </a>



    <!-- FIND JOBS -->

    <a href="jobs.html"
       class="menu">

        🔍 <span>Find Jobs</span>

    </a>



    <!-- MY APPLICATIONS -->

    <a href="applications.html"
       class="menu">

        📋 <span>My Applications</span>

    </a>



    <!-- JOB DETAILS -->

    <a href="job-details.html"
       class="menu">

        📌 <span>Job Details</span>

    </a>



    <!-- AVAILABILITY -->

    <a href="availability.html"
       class="menu active">

        🟢 <span>Availability</span>

    </a>



    <!-- EARNINGS -->

    <a href="earnings.html"
       class="menu">

        💰 <span>Earnings</span>

    </a>



    <!-- PAYMENTS -->

    <a href="payments.html"
       class="menu">

        💳 <span>Payments</span>

    </a>



    <!-- NOTIFICATIONS -->

    <a href="notifications.html"
       class="menu">

        🔔 <span>Notifications</span>

    </a>



    <!-- FEEDBACK & RATING -->

    <a href="feedback-rating.html"
       class="menu">

        ⭐ <span>Feedback & Rating</span>

    </a>



    <!-- LOGOUT -->

    <a href="../index.html"
       class="menu logout">

        🚪 <span>Logout</span>

    </a>


</aside>



<!-- =====================================================
                         MAIN
====================================================== -->

<main class="main">


<section id="availability" class="page active">


    <h1 class="page-title">

        Availability

    </h1>



    <!-- AVAILABILITY -->

    <div class="section">


        <div class="availability-box">


            <div>

                <h2 id="availabilityText">

                    Available

                </h2>

                <p>

                    Customers can send job requests.

                </p>

            </div>



            <div class="switch active"
                 id="availabilitySwitch"
                 onclick="toggleAvailability()">

                <div class="switch-circle">
                </div>

            </div>


        </div>

    </div>



    <!-- WORKING HOURS -->

    <div class="section">


        <h2>

            Working Hours

        </h2>



        <div class="form-grid">


            <div class="form-group">

                <label>

                    Start Time

                </label>


                <input
                    type="time"
                    value="09:00">

            </div>



            <div class="form-group">

                <label>

                    End Time

                </label>


                <input
                    type="time"
                    value="18:00">

            </div>


        </div>



        <button
            class="btn"
            onclick="saveHours()">

            Save Working Hours

        </button>


    </div>


</section>


</main>



<script src="../js/app.js"></script>


</body>

</html>
