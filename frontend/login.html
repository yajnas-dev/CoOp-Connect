<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Co-Op Connect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <!-- Brand -->
            <div class="auth-header">

                <div class="brand-icon">
                    🤝
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to your Co-Op Connect account
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Role -->
                <div class="form-group">

                    <label for="loginRole">
                        Login As
                    </label>

                    <select id="loginRole" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="CUSTOMER">
                            Customer
                        </option>

                        <option value="WORKER">
                            Worker
                        </option>

                        <option value="ADMIN">
                            Admin
                        </option>

                    </select>

                </div>


                <!-- Login -->
                <button
                    type="submit"
                    class="primary-btn"
                >
                    Login
                </button>

            </form>


            <!-- Message -->
            <div
                id="loginMessage"
                class="form-message"
                aria-live="polite"
            ></div>


            <!-- Register -->
            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
